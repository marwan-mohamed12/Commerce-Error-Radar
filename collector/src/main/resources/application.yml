server:
  port: 8088

spring:
  application:
    name: commerce-error-radar
  datasource:
    url: jdbc:sqlite:${radar.sqlite-path}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: never

radar:
  hybris-home: ${hybris.home:${HYBRIS_HOME:}}
  custom-package-prefix: ${RADAR_PREFIX:com.yourcompany}
  tail-from-end: true
  poll-interval-ms: 500
  context-lines: 30
  ring-buffer-size: 100
  sqlite-path: ${user.dir}/data/radar.db
  sample-logs-dir: ${user.dir}/../sample-logs
  ignore-patterns:
    - "Solr ping"
    - "session replication"
    - "HAC login"
    - "actuator/health"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%logger{20}] %msg%n"
  level:
    com.commerce.radar: INFO
    org.springframework.jdbc: WARN
