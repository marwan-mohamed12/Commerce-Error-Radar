<ul class="divide-y divide-rule" role="listbox">
  @for (issue of issues(); track issue.fingerprint) {
    <li>
      <button
        type="button"
        class="relative flex w-full min-w-0 gap-3 px-4 py-3 text-left transition hover:bg-raised/70 sm:px-5"
        [class.bg-raised]="selected() === issue.fingerprint"
        (click)="pick.emit(issue.fingerprint)"
      >
        @if (flash() === issue.fingerprint) {
          <span
            class="radar-sweep pointer-events-none absolute inset-0 bg-gradient-to-b from-transparent via-signal/20 to-transparent"
            style="animation: radar-sweep 1.15s ease-out"
          ></span>
        }
        <span
          class="mt-1.5 h-8 w-1 shrink-0 rounded-full"
          [class.bg-ember]="issue.level === 'ERROR' || issue.level === 'FATAL'"
          [class.bg-honey]="issue.level === 'WARN'"
          aria-hidden="true"
        ></span>
        <span class="min-w-0 flex-1">
          <span class="block break-words text-[0.95rem] leading-snug text-copy">{{ issue.title }}</span>
          <span class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 font-mono text-[0.68rem] text-mute">
            <span [class.text-ember]="issue.level !== 'WARN'" [class.text-honey]="issue.level === 'WARN'">
              {{ issue.level }}
            </span>
            <span>·</span>
            <span>{{ kindLabel(issue.kind) }}</span>
            @if (issue.hasCustomFrame) {
              <span class="text-brass">· mine</span>
            }
            <span class="ml-auto text-quiet">{{ rel(issue.lastSeen) }}</span>
          </span>
        </span>
        <span
          class="mt-0.5 shrink-0 rounded-md bg-canvas px-1.5 py-0.5 font-mono text-[0.72rem] tabular-nums text-quiet"
        >
          {{ issue.count }}
        </span>
      </button>
    </li>
  } @empty {
    <li class="px-6 py-20 text-center">
      <p class="font-display text-xl text-copy">Quiet for now</p>
      <p class="mx-auto mt-2 max-w-[28ch] text-sm leading-relaxed text-mute">
        ERROR and WARN from the Hybris console will land here and stay put.
      </p>
    </li>
  }
</ul>
