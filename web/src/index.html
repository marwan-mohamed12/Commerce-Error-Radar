<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Commerce Error Radar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Local ERROR and WARN inbox for SAP Commerce Hybris logs." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('radar-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
